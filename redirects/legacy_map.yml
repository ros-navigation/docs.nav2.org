# Redirect map: pre-MkDocs (Sphinx) URLs -> current documentation paths.
#
# Until the MkDocs migration, docs.nav2.org served a flat, unversioned Sphinx
# build at the domain root (e.g. /configuration/packages/configuring-amcl.html).
# The site is now versioned by mike (/rolling/, /lyrical/, /jazzy/) and uses
# directory URLs over a reorganized tree, so every one of those old URLs is dead.
# Years of inbound links -- search results, ROS Discourse threads, source
# comments, third-party tutorials -- still point at them.
#
# scripts/gen_legacy_redirects.py turns this map into static redirect stubs and a
# catch-all 404.html committed to the root of the gh-pages branch. The version
# prefix is NOT stored here; it is added at generation time (default: rolling).
#
# Keys are legacy paths relative to the site root; values are current paths
# relative to the version root. An empty value redirects to the version root.
#
# The legacy root index.html is deliberately absent: mike owns the gh-pages root
# index.html and already redirects / to the default version.
#
# This set is frozen -- the Sphinx site will never gain another page -- so entries
# should only ever be edited when a *target* moves, never added to.
#
