cache_dir: "macros/cache"
nav2_tree_nodes_file_path: "macros/cache/navigation2/nav2_behavior_tree/nav2_tree_nodes.xml"
nav2_bt_plugins_hpp_path: "/navigation2/nav2_behavior_tree/include/nav2_behavior_tree/plugins"
nav2_docking_hpp_path: "/navigation2/nav2_docking/opennav_docking_bt/include/opennav_docking_bt"
opennav_cov_bt_plugins_hpp_path: "/opennav_coverage/opennav_coverage_bt/include/opennav_coverage_bt"

github_repositories:
  navigation2:
    owner: "ros-navigation"
    branch: "main" # Rolling
    data_to_clone:
      - "/nav2_behavior_tree/nav2_tree_nodes.xml"
      - "/nav2_behavior_tree/include/nav2_behavior_tree/plugins"
      - "/nav2_docking/opennav_docking_bt/include/opennav_docking_bt"
  opennav_coverage:
    owner: "open-navigation"
    branch: "main" # Rolling
    data_to_clone:
      - "/opennav_coverage_bt/include/opennav_coverage_bt"
