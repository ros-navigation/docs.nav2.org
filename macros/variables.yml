cache_dir: "macros/cache"

# Paths relative to cache_dir:
nav2_bt_xml_file_path: "navigation2/nav2_behavior_tree/nav2_tree_nodes.xml"
nav2_bt_hpp_dir_path: "navigation2/nav2_behavior_tree/include/nav2_behavior_tree/plugins"
nav2_docking_hpp_dir_path: "navigation2/nav2_docking/opennav_docking_bt/include/opennav_docking_bt"

# GitHub data to clone for source code access
github_repositories:
  navigation2:
    owner: "ros-navigation"
    branch: "lyrical"
    destination_dir: "macros/cache"
    data_to_clone:
      - "/nav2_behavior_tree/nav2_tree_nodes.xml"
      - "/nav2_behavior_tree/include/nav2_behavior_tree/plugins"
      - "/nav2_docking/opennav_docking_bt/include/opennav_docking_bt"
  mkdocs.nav2.org:
    owner: "ros-navigation"
    branch: "rolling" # keep unchanged between distributions
    destination_dir: "docs/shared"
    data_to_clone:
      - "/docs/community"
      - "/docs/robots_using"
      - "/docs/about_and_contact"
