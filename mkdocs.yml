site_name: Nav2
# site_url: https://docs.nav2.org/ # Uncomment after documentation release
repo_url: https://github.com/ros-navigation/navigation2
repo_name: ros-navigation/navigation2
# repo_url: https://github.com/ros-navigation/docs.nav2.org
# repo_name: ros-navigation/docs.nav2.org
copyright: "&copy; Copyright 2026, Open Navigation LLC."

theme:
  name: material
  custom_dir: overrides
  logo: images/nav2_logo_48x48.png
  favicon: images/nav2_logo_48x48.png
  font:
    text: Inter
  icon:
    repo: fontawesome/brands/github
  palette:
  # Palette for light mode
  - scheme: default
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  # Palette for dark mode
  - scheme: slate
    toggle:
      icon: material/lightbulb-outline
      name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes
    - navigation.top # back-to-top button

plugins:
  - search
  - mike # All parameters: https://github.com/jimporter/mike#configuration

extra:
  version:
    provider: mike
  scope: /
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ros-navigation/navigation2
    - icon: fontawesome/brands/slack
      link: https://join.slack.com/t/navigation2/shared_invite/zt-uj428p0x-jKx8U7OzK1IOWp5TnDS2rA

# Path relative to custom_dir (overrides/)
extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/search_button.css
  - assets/stylesheets/sidebar.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
  nav:
    omitted_files: warn
    absolute_links: warn

exclude_docs: |
  axis_goal_checker_illustration.py

not_in_nav: |
  2021summerOfCode

